<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学选择题 · 在线答题</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>?</text></svg>">
<style>
  :root{
    --bg1:#0f1e3d; --bg2:#1a2f5c;
    --card:#ffffff; --ink:#1a2233; --ink-soft:#5a6478;
    --brand:#2f54eb; --brand-deep:#1d39c4; --gold:#faad14;
    --good:#52c41a; --good-bg:#f6ffed; --good-line:#b7eb8f;
    --bad:#f5222d; --bad-bg:#fff2f0; --bad-line:#ffccc7;
    --line:#e6e9f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:100%;max-width:720px}
  .card{background:var(--card);border-radius:20px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

  .hero{text-align:center}
  .hero .badge{display:inline-block;background:rgba(250,173,20,.15);color:var(--gold);
    font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;letter-spacing:1px;margin-bottom:18px}
  .hero h1{font-size:26px;line-height:1.35;margin-bottom:10px}
  .hero .sub{color:var(--ink-soft);font-size:14px;line-height:1.8;margin-bottom:20px}
  .hero .stats{display:flex;justify-content:center;gap:24px;margin-bottom:22px}
  .hero .stats .item{text-align:center}
  .hero .stats .num{font-size:24px;font-weight:700;color:var(--brand)}
  .hero .stats .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px}

  .btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;
    padding:13px 30px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));
    color:#fff;transition:transform .12s,box-shadow .12s;box-shadow:0 6px 18px rgba(47,84,235,.35)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,84,235,.45)}
  .btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
  .btn.ghost:hover{background:#f0f5ff}
  .btn.danger{background:linear-gradient(135deg,#f5222d,#cf1322);box-shadow:0 6px 18px rgba(245,34,45,.35)}
  .btn.danger:hover{box-shadow:0 10px 24px rgba(245,34,45,.45)}
  .btn.small{padding:8px 18px;font-size:14px}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#fff}
  .topbar .lv{font-size:14px;font-weight:600;opacity:.9}
  .topbar .score{font-size:14px;opacity:.9}
  .topbar .score b{color:var(--gold);font-size:18px}
  .progress{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#ffd666);border-radius:99px;transition:width .35s}

  .qcard .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);
    background:#f0f5ff;padding:4px 10px;border-radius:6px;margin-bottom:12px}
  .qcard .stem{font-size:17px;line-height:1.75;font-weight:600;margin-bottom:14px}
  .claims{background:#f7f9fc;border-radius:10px;padding:10px 16px;margin-bottom:14px}
  .claim{font-size:14px;line-height:1.75;color:var(--ink-soft);padding:7px 0;border-bottom:1px dashed var(--line)}
  .claim:last-child{border-bottom:none}
  .claim .n{color:var(--brand);font-weight:700;margin-right:6px}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .option-btn{padding:13px 10px;border:2px solid var(--line);background:#fff;
    border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);transition:all .15s;text-align:left}
  .option-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);background:#f0f5ff}
  .option-btn.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .option-btn.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .option-btn:disabled{cursor:default;opacity:.9}

  .feedback{margin-top:16px;border-radius:14px;padding:16px;display:none}
  .feedback.show{display:block;animation:pop .3s ease}
  .feedback.good{background:var(--good-bg);border:1px solid var(--good-line)}
  .feedback.bad{background:var(--bad-bg);border:1px solid var(--bad-line)}
  .feedback .verdict{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .feedback.good .verdict{color:var(--good)}
  .feedback.bad .verdict{color:var(--bad)}
  .feedback .verdict .dot{width:22px;height:22px;border-radius:50%;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px}
  .feedback.good .dot{background:var(--good)}
  .feedback.bad .dot{background:var(--bad)}
  .feedback .ans-line{font-size:14px;color:var(--ink)}

  .next-row{margin-top:16px;text-align:right;display:none}
  .next-row.show{display:block}

  .name-input{width:100%;font-family:inherit;font-size:18px;padding:14px 16px;
    border:2px solid var(--line);border-radius:12px;outline:none;text-align:center;margin-bottom:18px}
  .name-input:focus{border-color:var(--brand)}

  .upload-box{background:#f7f9fc;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:14px}
  .upload-box .ok{color:var(--good);font-weight:600}
  .upload-box .err{color:var(--bad);font-weight:600}

  .teacher-area textarea{width:100%;min-height:120px;font-family:monospace;font-size:13px;
    padding:12px;border:2px solid var(--line);border-radius:10px;outline:none;resize:vertical}
  .teacher-area textarea:focus{border-color:var(--brand)}
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px;table-layout:fixed}
  th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);word-break:break-all}
  th{background:#f7f9fc;font-weight:600;color:var(--ink)}
  td.good{color:var(--good);font-weight:600}
  td.bad{color:var(--bad);font-weight:600}
  .rank-1{color:var(--gold);font-weight:700}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat-grid .box{background:#f7f9fc;border-radius:12px;padding:12px 6px;text-align:center}
  .stat-grid .n{font-size:20px;font-weight:700;color:var(--brand)}
  .stat-grid .l{font-size:12px;color:var(--ink-soft);margin-top:2px}

  /* 教师端答案设置 */
  .ans-list{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
  .ans-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ans-item .no{font-weight:700;color:var(--brand);min-width:28px;font-size:14px;padding-top:2px}
  .ans-item .stem{flex:1;font-size:13px;color:var(--ink-soft);line-height:1.6;padding-top:2px}
  .ans-item .pick{display:flex;gap:6px;flex-wrap:wrap}
  .ans-btn{width:34px;height:34px;border:2px solid var(--line);background:#fff;border-radius:8px;
    cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);transition:all .15s}
  .ans-btn:hover:not(.sel){border-color:var(--brand);color:var(--brand)}
  .ans-btn.sel{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .ans-item .cur{font-size:12px;color:var(--ink-soft);min-width:44px;text-align:right;padding-top:8px}

  .result{text-align:center}
  .result .trophy{font-size:52px;margin-bottom:8px}
  .result h2{font-size:24px;margin-bottom:6px}
  .result .desc{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
  .result .stars{font-size:30px;letter-spacing:6px;color:#d9d9d9;margin-bottom:18px}
  .result .stars .on{color:var(--gold)}
  .result .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .result .grid .box{background:#f7f9fc;border-radius:12px;padding:12px 6px}
  .result .grid .n{font-size:20px;font-weight:700;color:var(--brand)}
  .result .grid .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .review{text-align:left;max-height:260px;overflow-y:auto;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
  .review h3{font-size:14px;margin-bottom:10px}
  .review .item{font-size:13px;line-height:1.6;color:var(--ink-soft);
    padding:8px 10px;border-radius:8px;margin-bottom:6px;background:#fafbfd}
  .review .item .q{color:var(--ink);font-weight:500}
  .review .item .tag-w{color:var(--bad);font-weight:600}
  .review .item .tag-b{color:var(--gold);font-weight:600}

  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:480px){
    .card{padding:24px 18px}
    .hero h1{font-size:21px}
    .qcard .stem{font-size:16px}
    .options{grid-template-columns:1fr}
    .stat-grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="stage" id="app"></div>

<script>
/* ============================================================
   ★ 哲学选择题 · 在线答题（云端成绩自动汇总 + 教师端答案设置）★

const CLOUD_CONFIG = {

const TEACHER_PASS = "5201314";
const LETTERS = ["A","B","C","D"];

/* ===== 题库（16 道单选题） =====
   每项：q=题干，claims=①②③④论断，opts=四个选项组合，ans=默认正确答案索引(0=A,1=B,2=C,3=D)

   教师端可修改并保存到云端，学生做题时优先使用云端答案 */
const QUESTIONS = [
  {q:"“十五五”规划编制过程中，国家深入调研我国现实国情、发展成就与短板，准确研判全球变局、科技与产业变革趋势；广泛征求社会意见，遵循经济社会发展规律，科学确定2026—2030年重点目标和战略任务，立足实际谋发展、遵循规律绘蓝图。从哲学的基本问题角度看，材料体现了：",
   claims:["物质和意识是辩证统一的","存在决定思维，坚持了唯物主义立场","思维能够正确认识存在，坚持了可知论","思维是世界的本原，存在依赖于人的思维"],
   opts:["①②","①④","②③","③④"], ans:2},
  {q:"哲学史上存在唯物主义和唯心主义两大基本派别，二者的分歧是围绕物质和意识谁是本原的问题展开的。下列选项中，能够体现两大派别对立的是：",
   claims:["“天地合而万物生，阴阳接而变化起”与“心外无物，心外无事，心外无理”","“形存则神存，形谢则神灭”与“不是风动，不是幡动，仁者心动”","“物是观念的集合”与“世界的发展是‘绝对精神’的自我运动”","“世异则事异，事异则备变”与“理在气先，理主动静”"],
   opts:["①②","①③","②④","③④"], ans:0},
  {q:"立足我国发展实际，我国在现代化建设实践中提出发展新质生产力，这一理论成果扎根社会实践、回应时代课题，也生动印证马克思主义哲学的理论品格。下列对马克思主义哲学的基本特征解读正确的是：",
   claims:["立足于现代化建设实践，体现实践观点是马克思主义哲学的核心观点","它在科学基础上实现唯物主义与辩证法、自然观与历史观的有机统一","作为现成理论公式，体现了与时俱进是马克思主义哲学独特的理论品质","作为科学的世界观和方法论，它摒弃前人思想，独立开创全新哲学体系"],
   opts:["①②","①③","②④","③④"], ans:0},
  {q:"面对人口老龄化加剧、传统养老模式不足的现实，我国落实银发经济相关政策，推动人工智能与养老服务深度融合。各类养老智能设备投入使用，能够监测老人健康状况，提供照料与情感陪伴，补齐传统养老短板，实现科技赋能养老。下列对此认识正确的是：",
   claims:["人工智能作为认识工具，能够开展具有目的性的思维活动","人们立足社会现实，在正确意识指导下推动养老服务模式创新","人工智能拓展了人的认识能力，能够直接把握事物的本质规律","意识活动具有能动创造性，人们研发智能设备提升养老服务水平"],
   opts:["①②","①③","②④","③④"], ans:2},
  {q:"2026年7月，我国长征十号乙运载火箭一子级完成全球首次海上网系回收，科研团队精准掌握火箭返回、捕获回收的复杂运行规律，为我国可重复使用航天技术发展积累关键数据，有力提升进出空间的能力。这一成果说明：",
   claims:["意识活动具有目的性和自觉选择性","物质是运动固有的根本属性和存在方式","人可以发挥主观能动性认识和利用规律","发挥主观能动性可以突破客观条件的制约"],
   opts:["①②","①③","②④","③④"], ans:1},
  {q:"2026年9月7日，工信部等六部门发布《关于推动历史经典产业高质量发展的意见》，提出到2028年，培育50家百亿规模龙头企业，塑造100个中国消费名品，打造若干千亿级规模特色产业集群，形成梯次分布、优势互补的产业布局。从唯物辩证法角度看，这一部署体现了：",
   claims:["人能够能动地认识和改造世界，对产业发展作出科学谋划","重视部分的作用，以龙头企业、名品发展带动产业整体进步","人们可以根据自身的需要建立历史经典产业新的具体联系","把握联系的普遍性，看到产业内各主体之间的相互影响、相互制约"],
   opts:["①②","①③","②④","③④"], ans:2},
  {q:"2025年12月18日，海南自贸港启动全岛封关运作。依托自贸港政策红利，海南培育四大主导产业，布局未来产业，同时加强琼吉两地协作，依托各自资源禀赋，打造“长春制造+海南政策+全球市场”等产业闭环，实现优势互补、协同发展。材料表明：",

   opts:["①③","①④","②③","②④"], ans:0},
  {q:"我国载人登月工程稳步推进，从长征十号火箭、梦舟飞船、揽月月面着陆器的地面试验，到多项关键技术验证取得阶段性突破，我国正一步步向着2030年前实现中国人登陆月球的目标迈进。从空间站常态化在轨运行，到载人登月工程的持续攻关，中国航天不断拓展人类探索深空的边界。这一发展历程表明：",
   claims:["事物发展是量变与质变的统一，质变是量变的必然结果","事物发展前途是光明的，新生事物取代旧事物是历史必然","人类对太空的探索是一个不断推进、永无止境的发展过程","人能够能动地认识世界，航天人不断刷新月球及深空领域的规律"],
   opts:["①②","①③","②④","③④"], ans:1},
  {q:"2026年11月，亚太经合组织第三十三次领导人非正式会议将在深圳举行。深圳从边陲小镇成长为现代化国际大都市，科技创新实力强劲，实现科技与人文深度融合。中方在深圳前海设立“促进APEC数据跨境流动合作中国中心”，为亚太数字化合作贡献力量。深圳的发展实践，为亚太经济体提供了有益借鉴。这说明：",
   claims:["矛盾的个性寓于共性之中，深圳发展经验可供亚太经济体借鉴","事物发展是量变与质变的统一，深圳的蝶变是长期积累的结果","联系具有普遍性，深圳发展能够为亚太地区合作带来积极影响","矛盾双方相互排斥、相互对立，科技与人文无法实现交融共生"],
   opts:["①③","①④","②③","②④"], ans:2},
  {q:"近年来，我国自然灾害频发、安全生产新旧风险交织，城市安全、基层防控压力持续加大。2026年我国出台了《现代化应急体系建设“十五五”规划》（简称规划），统筹发展和安全，推动公共安全治理模式向事前预防转型。规划设置阶段性目标：到2030年应急管理现代化取得明显进展；到2035年建成适配现代化的大国应急体系。这体现了：",
   claims:["真理是具体的、有条件的，任何真理都包含谬误的成分","实践是认识的基础，应急治理实践推动应急安全认识深化","认识具有无限性和上升性，要在实践中不断发展应急治理认识","真理是客观的，在同一条件下人们对同一对象的真理性认识只有一个"],
   opts:["①②","①④","②③","③④"], ans:2},
  {q:"江苏、上海科研团队在基础研究领域实现多项原创突破。过去科学界长期把套索RNA视作毫无用处的“分子垃圾”，认为其只是RNA剪接的无用副产物。科研团队通过跨学科协作，攻克实验技术难题，首次证实套索RNA具备重要生物学功能，打破传统认知，修正了原有科学认识，为药物研发、作物育种开辟新路径。这说明：",

/* ===== 答案：默认值 + 云端覆盖 ===== */
let ANSWERS = QUESTIONS.map(q=>q.ans);   // 当前生效答案（索引）
let CLOUD_ANS_LOADED = false;

async function loadCloudAnswers(){
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),3000);
    const r = await fetch(`${CLOUD_CONFIG.base}/v2/${CLOUD_CONFIG.ns}/answers-zhexue`, {
      headers:{"X-Mantle-Key":CLOUD_CONFIG.key},
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(r.ok){
      const d = await r.json();
      if(d && Array.isArray(d.answers) && d.answers.length===QUESTIONS.length){
        ANSWERS = d.answers.map(Number);
        CLOUD_ANS_LOADED = true;
      }
    }
  }catch(e){ /* 无云端答案或超时时用默认 */ }
}

/* ===== 状态 ===== */
const state = {
  mode:"start",  // start | student | play | done | teacher | dash | answers
  studentName:"", studentClass:"",
  idx:0, score:0,
  wrong:[], picked:-1, answered:false,
  ansDraft:[]
};
const app = document.getElementById("app");

function render(){
  if(state.mode==="start") return renderStart();
  if(state.mode==="student") return renderName();
  if(state.mode==="teacher") return renderTeacherLogin();
  if(state.mode==="dash") return renderDashboard();
  if(state.mode==="answers") return renderAnswers();
  if(state.idx>=QUESTIONS.length) return renderDone();
  renderPlay();
}

/* ===== 云端：成绩上传 / 读取 ===== */
async function uploadResult(rec){
  const ts=Date.now();
  const rand=Math.random().toString(36).slice(2,8);
  const path=`zhexue/${ts}-${rand}`;   // 独立前缀，与旧闯关页数据互不干扰
  const res=await fetch(`${CLOUD_CONFIG.base}/v2/${CLOUD_CONFIG.ns}/${path}`,{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Mantle-Key":CLOUD_CONFIG.key},
    body:JSON.stringify(rec)
  });
  if(!res.ok) throw new Error("上传失败");
  return {ok:true, msg:"成绩已自动提交给老师"};
}

async function fetchResults(){
  const listRes=await fetch(`${CLOUD_CONFIG.base}/v2/list/${CLOUD_CONFIG.ns}`,{
    headers:{"X-Mantle-Key":CLOUD_CONFIG.key}
  });
  if(!listRes.ok) throw new Error("读取成绩列表失败");
  const list=await listRes.json();
  const paths=(list.entries||[]).map(e=>e.path).filter(p=>p.startsWith("zhexue/"));
  const rows=[];
  for(const p of paths){
    const r=await fetch(`${CLOUD_CONFIG.base}/v2/${CLOUD_CONFIG.ns}/${p}`,{headers:{"X-Mantle-Key":CLOUD_CONFIG.key}});
    if(!r.ok) continue;
    const a=await r.json();
    const right=a.right||0, total=a.total||0;
    rows.push({
      name:a.name||"匿名", cls:a.cls||"",
      score:a.score||0, right:right, total:total,
      rate:Math.round(right/total*100),
      wrongNums:a.wrongNums||"", time:a.time||""
    });
  }
  rows.sort((x,y)=>y.score-x.score);
  return {ok:true, rows};
}

/* ===== 答题页 ===== */
function renderPlay(){
  const q=QUESTIONS[state.idx];
  const total=QUESTIONS.length;
  const pct=(state.idx/total)*100;
  const judged=state.answered;
  const showNext=judged;

  let fbClass="", fbHTML="";
  if(judged){
    fbClass = state.picked===ANSWERS[state.idx] ? "good" : "bad";
    fbHTML=`
      <div class="verdict"><span class="dot">${state.picked===ANSWERS[state.idx]?"✓":"✕"}</span>
        ${state.picked===ANSWERS[state.idx]?"回答正确！":"回答错误，正确答案是 <b>"+LETTERS[ANSWERS[state.idx]]+"（"+q.opts[ANSWERS[state.idx]]+"）</b>"}</div>`;
  }

  const optsHTML = q.opts.map((o,i)=>{
    let cls="option-btn";
    if(judged){
      if(i===ANSWERS[state.idx]) cls+=" right";
      else if(i===state.picked) cls+=" wrong";
    }
    return `<button class="${cls}" ${judged?"disabled":""} onclick="pickAns(${i})">${LETTERS[i]}. ${o}</button>`;
  }).join("");

  app.innerHTML=`
    <div class="topbar">
      <div class="lv">${state.studentClass?state.studentClass+" · ":""}${state.studentName} · 第 ${state.idx+1} 题 / 共 ${total} 题</div>
      <div class="score">得分 <b>${state.score}</b></div>
    </div>
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="card qcard">
      <div class="tag">单选题</div>
      <div class="stem">${state.idx+1}. ${q.q}</div>
      <div class="claims">${q.claims.map((c,i)=>`<div class="claim"><span class="n">${i+1}.</span>${c}</div>`).join("")}</div>
      <div class="options">${optsHTML}</div>
      <div class="feedback ${judged?"show "+fbClass:""}">${fbHTML}</div>
      <div class="next-row ${showNext?"show":""}">
        <button class="btn" onclick="nextQ()">${state.idx+1>=total?"查看成绩":"下一题 →"}</button>
      </div>
    </div>`;
  if(judged){
    setTimeout(()=>{
      const nr=document.querySelector(".next-row.show");
      if(nr) nr.scrollIntoView({behavior:"smooth",block:"center"});
    },80);
  }
}

window.pickAns = function(i){
  if(state.answered) return;
  const q=QUESTIONS[state.idx];
  state.picked=i;
  state.answered=true;
  if(i===ANSWERS[state.idx]){
    state.score+=1;
  }else{
    state.wrong.push({num:state.idx+1, q:q.q, right:LETTERS[ANSWERS[state.idx]]+"（"+q.opts[ANSWERS[state.idx]]+"）", your:LETTERS[i]+"（"+q.opts[i]+"）"});
  }
  renderPlay();
};

window.nextQ = function(){
  state.idx++;
  state.picked=-1; state.answered=false;
  render();
};

/* ===== 学生结算页 ===== */
function renderDone(){
  const total=QUESTIONS.length;
  const wj=state.wrong.length;
  const right=total-wj;
  const rate=Math.round(right/total*100);
  let stars=1;
  if(rate>=90) stars=3; else if(rate>=70) stars=2;
  let title,desc;
  if(stars===3){title="满分风采！";desc="哲学选择题掌握得非常扎实。";}
  else if(stars===2){title="表现不错！";desc="看看错题，争取全对。";}
  else{title="答题完成";desc="建议把错题再过一遍，重新挑战。";}
  let starsHTML="";
  for(let i=1;i<=3;i++) starsHTML+=`<span class="${i<=stars?"on":""}">★</span>`;

  let review="";
  if(wj){
    review=`<div class="review"><h3>错题回顾</h3>`;
    state.wrong.forEach(w=>{
      review+=`<div class="item"><div class="q">${w.num}. ${w.q}</div>
        <div>你选了 <span class="tag-w">${w.your}</span> ｜ 正确答案：<b>${w.right}</b></div></div>`;
    });
    review+=`</div>`;
  }else{
    review=`<div class="review"><div style="text-align:center;color:var(--good);font-weight:600;padding:10px">全部答对，一道错题都没有！</div></div>`;
  }

  const wrongNums=state.wrong.map(w=>w.num).join(",");
  const rec={name:state.studentName,cls:state.studentClass,score:state.score,right:right,total:total,rate:rate,wrongNums:wrongNums};
  let uploadBox=`<div class="upload-box" id="uploadBox">正在自动提交成绩…</div>`;

  app.innerHTML=`
    <div class="card result">
      <div class="trophy">🏁</div>
      <h2>${title}</h2>
      <div class="desc">${desc}</div>
      <div class="stars">${starsHTML}</div>
      <div class="grid">
        <div class="box"><div class="n">${state.score}</div><div class="l">总分</div></div>
        <div class="box"><div class="n">${right}/${total}</div><div class="l">答对</div></div>
        <div class="box"><div class="n">${rate}%</div><div class="l">正确率</div></div>
      </div>
      ${uploadBox}
      ${review}
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" onclick="restartStudent()">再答一次</button>
        <button class="btn ghost" onclick="state.mode='start';render()">返回首页</button>
      </div>
    </div>`;

  uploadResult(rec).then(res=>{
    const box=document.getElementById("uploadBox");
    if(!box) return;
    box.innerHTML=res.ok?`<div class="ok">✓ ${res.msg}</div>`:`<div class="err">✕ ${res.msg}</div>`;
  }).catch(()=>{
    const box=document.getElementById("uploadBox");
    if(box) box.innerHTML=`<div class="err">✕ 上传失败（网络异常），请检查网络后重试</div>`;
  });
}

  state.picked=-1; state.answered=false;
  state.mode="play";
  render();

async function loadDashboard(){
  const area=document.getElementById("dashArea");
  if(!area) return;
  area.innerHTML=`<div style="text-align:center;color:var(--ink-soft);padding:30px">加载中…</div>`;
  try{
    const res=await fetchResults();
    if(!res.ok){
      area.innerHTML=`<div style="color:var(--bad);padding:20px;text-align:center;font-size:14px">${res.msg}</div>`;
      return;
    }
    const rows=res.rows;
    if(!rows.length){
      area.innerHTML=`<div style="color:var(--ink-soft);padding:20px;text-align:center;font-size:14px">暂无成绩。学生答题提交后会自动出现在这里。</div>`;
      return;
    }
    const n=rows.length;
    const avgScore=Math.round(rows.reduce((s,r)=>s+r.score,0)/n);
    const maxScore=Math.max(...rows.map(r=>r.score));
    const avgRate=Math.round(rows.reduce((s,r)=>s+r.rate,0)/n);
    window.__rows=rows;
    let html=`
      <div class="stat-grid">
        <div class="box"><div class="n">${n}</div><div class="l">已提交</div></div>
        <div class="box"><div class="n">${maxScore}</div><div class="l">最高分</div></div>
        <div class="box"><div class="n">${avgScore}</div><div class="l">平均分</div></div>
      </div>
      <table>
        <colgroup><col style="width:8%"><col style="width:11%"><col style="width:11%"><col style="width:8%"><col style="width:17%"><col style="width:11%"><col style="width:34%"></colgroup>
        <thead><tr><th>名次</th><th>班级</th><th>姓名</th><th>总分</th><th>答对</th><th>正确率</th><th>错题号</th></tr></thead><tbody>`;
    rows.forEach((s,i)=>{
      const rateCls=s.rate>=90?"good":(s.rate<60?"bad":"");
      html+=`<tr>
        <td class="${i===0?"rank-1":""}">${i+1}</td>
        <td>${s.cls||"-"}</td>
        <td><b>${s.name}</b></td>
        <td><b>${s.score}</b></td>
        <td>${s.right}/${s.total}</td>
        <td class="${rateCls}">${s.rate}%</td>
        <td style="font-size:12px">${s.wrongNums||"全对"}</td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    html+=`<div style="margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center">共 ${n} 人已自动提交 · 平均正确率 ${avgRate}%</div>`;
    area.innerHTML=html;
  }catch(err){
    area.innerHTML=`<div style="color:var(--bad);padding:20px;text-align:center;font-size:14px">读取失败：${err&&err.message||"网络异常"}，请检查网络后重试。</div>`;
  }
}

window.exportCSV = function(){
  const rows=window.__rows||[];
  if(!rows.length){ alert("暂无成绩可导出"); return; }
  const lines=["名次,班级,姓名,总分,答对,正确率,错题号"];
  rows.forEach((s,i)=>{ lines.push(`${i+1},${s.cls||"-"},${s.name},${s.score},${s.right}/${s.total},${s.rate}%,${s.wrongNums||"全对"}`); });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="哲学选择题成绩汇总.csv";
  a.click();
};

/* ===== 老师端：答案设置 ===== */
function renderAnswers(){
  if(!state.ansDraft.length) state.ansDraft=ANSWERS.slice();
  const listHTML=QUESTIONS.map((q,i)=>{
    const cur=state.ansDraft[i];
    return `
      <div class="ans-item">
        <div class="no">${i+1}</div>
        <div class="stem">${q.q.slice(0,42)}${q.q.length>42?"…":""}</div>
        <div class="pick">${LETTERS.map((L,li)=>`<button class="ans-btn ${li===cur?"sel":""}" onclick="toggleAns(${i},${li})">${L}</button>`).join("")}</div>
        <div class="cur">当前：${LETTERS[cur]}</div>
      </div>`;
  }).join("");

  app.innerHTML=`
    <div class="card teacher-area">
      <div class="badge" style="display:inline-block;background:rgba(250,173,20,.15);color:var(--gold);font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:14px">老师后台 · 答案设置</div>
      <h2 style="margin-bottom:6px">设置选择题答案</h2>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">点击每题对应的字母修改答案，修改后点"保存答案"，学生端下次作答立即生效。
        ${CLOUD_ANS_LOADED?"<span style='color:var(--good)'>（当前使用云端已保存的答案）</span>":"（当前使用默认答案）"}</div>
      <div class="ans-list">${listHTML}</div>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn" onclick="saveAnswers()">保存答案</button>
        <button class="btn ghost" onclick="resetAnswers()">恢复默认</button>
        <button class="btn ghost" onclick="state.mode='dash';render()">返回后台</button>
      </div>
      <div id="ansMsg" style="margin-top:14px;font-size:14px;color:var(--good);text-align:center"></div>
    </div>`;
}

window.toggleAns = function(i,li){
  state.ansDraft[i]=li;
  renderAnswers();
};

window.resetAnswers = function(){
  state.ansDraft=QUESTIONS.map(q=>q.ans);
  renderAnswers();
};

window.saveAnswers = async function(){
  const msg=document.getElementById("ansMsg");
  msg.textContent="正在保存…";
  try{
    const res=await fetch(`${CLOUD_CONFIG.base}/v2/${CLOUD_CONFIG.ns}/answers-zhexue`,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Mantle-Key":CLOUD_CONFIG.key},
      body:JSON.stringify({answers:state.ansDraft})
    });
    if(!res.ok) throw new Error("保存失败");
    ANSWERS=state.ansDraft.slice();
    CLOUD_ANS_LOADED=true;
    msg.textContent="✓ 答案已保存到云端，学生端立即生效";
  }catch(e){
    msg.style.color="var(--bad)";
    msg.textContent="✕ 保存失败（网络异常），请重试";
  }
};

/* ===== 清除全部成绩（需老师密码二次确认） ===== */
async function deleteRecord(path){
  const res=await fetch(`${CLOUD_CONFIG.base}/v2/${CLOUD_CONFIG.ns}/${path}`,{
    method:"DELETE",
    headers:{"X-Mantle-Key":CLOUD_CONFIG.key}
  });
  return res.ok;
}

window.askClear = function(){
  const pwd=prompt("⚠ 确定要清除全部学生成绩吗？\n此操作不可恢复！\n请输入老师访问密码确认：");
  if(pwd===null) return;
  if(pwd.trim()!==TEACHER_PASS){ alert("密码错误，已取消清除"); return; }
  if(!confirm("最后确认：将永久删除云端全部成绩记录，确定继续？")) return;
  clearAll();
};

async function clearAll(){
  const area=document.getElementById("dashArea");
  if(!area) return;
  area.innerHTML=`<div style="text-align:center;color:var(--ink-soft);padding:30px">正在清除成绩…</div>`;
  try{
    const listRes=await fetch(`${CLOUD_CONFIG.base}/v2/list/${CLOUD_CONFIG.ns}`,{headers:{"X-Mantle-Key":CLOUD_CONFIG.key}});
    if(!listRes.ok) throw new Error("读取成绩列表失败");
    const list=await listRes.json();
    const paths=(list.entries||[]).map(e=>e.path).filter(p=>p.startsWith("zhexue/"));
    if(!paths.length){
      area.innerHTML=`<div style="color:var(--good);padding:20px;text-align:center">当前没有成绩记录，无需清除。</div>`;
      return;
    }
    let ok=0, fail=0;
    for(const p of paths){
      if(await deleteRecord(p)) ok++; else fail++;
    }
    window.__rows=[];
    area.innerHTML=`<div style="padding:20px;text-align:center;font-size:14px">
      <div style="color:var(--good);font-weight:700;font-size:18px;margin-bottom:8px">已清除 ${ok} 条成绩</div>
      ${fail?`<div style="color:var(--bad)">${fail} 条清除失败，请刷新后重试</div>`:"<div style='color:var(--ink-soft)'>全部成绩已清空，学生可重新作答提交</div>"}
    </div>`;
  }catch(err){
    area.innerHTML=`<div style="color:var(--bad);padding:20px;text-align:center">清除失败：${err&&err.message||"网络异常"}，请重试。</div>`;
  }
}

/* 初始：立即渲染首页，云端答案异步加载（超时自动用默认答案） */
renderStart();
loadCloudAnswers();
</script>
</body>
</html>
